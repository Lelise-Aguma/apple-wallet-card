<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMER — Glass Wallet Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="scene">
        <div class="wallet-card" id="walletCard">
            
            <!-- Header -->
            <div class="wallet-header">
                <div class="logo">LD</div>
                <div class="brand">
                    <h1>LUMER</h1>
                    <p>DESIGNED BY LELISE</p>
                </div>
            </div>

            <div class="divider"></div>

            <!-- Content -->
            <div class="content">
                <h2>Crafting Luxury<br>Digital Experiences</h2>
                <p class="sub">For visionary brands and modern businesses.</p>
                <div class="beam"></div>

                <!-- Info + QR Two-Column -->
                <div class="info-wrap">
                    <div class="info">
                        <div class="info-item">
                            <div class="icon">◎</div>
                            <span>lumer.studio</span>
                        </div>
                        <div class="info-item">
                            <div class="icon">✉</div>
                            <span>hello@lumer.studio</span>
                        </div>
                        <div class="info-item">
                            <div class="icon">⌖</div>
                            <span>Worldwide</span>
                        </div>
                    </div>

                    <div class="qr-wrap">
                        <div class="qr" id="qrContainer">
                            <!-- Real QR placeholder – replace src with your actual QR image -->
                            <div class="qr-inner"></div>
                        </div>
                        <div class="scan">LUMER ACCESS</div>
                    </div>
                </div>

                <!-- Apple Wallet Button -->
                <button class="wallet-btn" id="walletBtn">
                    <div class="wallet-left">
                        <div class="wallet-icon"></div>
                        <span>Add to Apple Wallet</span>
                    </div>
                    <div class="nfc">))) </div>
                </button>

                <div class="footer">LOOKS PERFECT IN APPLE WALLET</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
